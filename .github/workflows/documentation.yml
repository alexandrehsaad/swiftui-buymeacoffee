name: Documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Documentation
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Get Swift Version
        run: swift --version
      - name: Build Documentation
        run: |
          xcodebuild docbuild \
            -scheme swiftui-buymeacoffee \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/documentation \
            CODE_SIGNING_ALLOWED=NO \
            DOCC_HOSTING_BASE_PATH=swiftui-buymeacoffee
          xcrun docc process-archive transform-for-static-hosting \
            .build/documentation/Build/Products/Debug-iphonesimulator/BuyMeACoffee.doccarchive \
            --output-path ./docs \
            --hosting-base-path swiftui-buymeacoffee
          echo '<meta http-equiv="refresh" content="0; url=documentation/buymeacoffee/">' > docs/index.html
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "docs"
      - name: Deploy Documentation
        id: deployment
        uses: actions/deploy-pages@v4
