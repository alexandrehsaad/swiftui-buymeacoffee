name: Snapshot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "release/**"]
    types: ["opened", "reopened", "synchronize"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Test iOS Snapshots
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Get Xcode Version
        run: xcodebuild -version
      - name: Test iOS Snapshots
        run: |
          xcrun swift Scripts/GenerateSnapshotHost.swift
          xcodebuild test \
            -project .build/snapshots/Host/SnapshotHost.xcodeproj \
            -scheme SnapshotHost \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -parallel-testing-enabled NO \
            -resultBundlePath .build/snapshots/CI.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload Snapshot Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshot-results
          path: .build/snapshots/CI.xcresult
          if-no-files-found: ignore
          include-hidden-files: true
